<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Fund 60/20/20 Portfolio Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header class="app-header">
        <div class="brand-title">3-Fund (60/20/20) Threshold Allocation Engine</div>
        <div class="system-status" id="systemStatus">Engine Status: Ready</div>
    </header>

    <main class="viewport-container">
        <section class="control-panel">
            <form id="simulationParametersForm" class="parameters-form">
                <div class="input-group">
                    <label for="net_worth">Starting Portfolio Net Worth ($)</label>
                    <input type="number" id="net_worth" name="net_worth" value="1000000" step="any" required>
                </div>

                <div class="input-group">
                    <label for="expenses">Initial Annual Spending ($)</label>
                    <input type="number" id="expenses" name="expenses" value="27500" step="any" required>
                </div>

                <div class="input-group-row">
                    <div class="input-group">
                        <label for="us_stock_rate">US Equity CAGR</label>
                        <input type="number" id="us_stock_rate" name="us_stock_rate" min="-0.20" max="0.40" step="0.001" value="0.08" required>
                    </div>
                    <div class="input-group">
                        <label for="us_stock_sigma">US Volatility (SD)</label>
                        <input type="number" id="us_stock_sigma" name="us_stock_sigma" min="0.01" max="0.80" step="0.001" value="0.15" required>
                    </div>
                </div>

                <div class="input-group-row">
                    <div class="input-group">
                        <label for="intl_stock_rate">Intl Equity CAGR</label>
                        <input type="number" id="intl_stock_rate" name="intl_stock_rate" min="-0.20" max="0.40" step="0.001" value="0.072" required>
                    </div>
                    <div class="input-group">
                        <label for="intl_stock_sigma">Intl Volatility (SD)</label>
                        <input type="number" id="intl_stock_sigma" name="intl_stock_sigma" min="0.01" max="0.80" step="0.001" value="0.18" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="bond_rate">Expected Bond Return Rate</label>
                    <input type="number" id="bond_rate" name="bond_rate" min="0.0" max="0.20" step="0.001" value="0.04" required>
                </div>

                <div class="input-group">
                    <label for="inflation_rate">Expected Long-Term Inflation</label>
                    <input type="number" id="inflation_rate" name="inflation_rate" min="-0.05" max="0.25" step="0.001" value="0.025" required>
                </div>

                <div class="input-group">
                    <label for="horizon">Retirement Horizon (Years)</label>
                    <input type="number" id="horizon" name="horizon" min="1" max="100" value="65" required>
                </div>

                <div class="input-group">
                    <label for="num_simulations">Monte Carlo Cycles / Trials</label>
                    <input type="number" id="num_simulations" name="num_simulations" min="1" max="10000" value="2000" required>
                </div>

                <div class="action-container">
                    <button type="submit" id="simulateBtn" class="btn btn-primary">Run Monte Carlo Simulation</button>
                </div>

                <div class="progress-wrapper idled" id="progressWrapper">
                    <div class="progress-label-container">
                        <span>Array Processing Progress</span>
                        <span id="progressBarPct">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressBarFill"></div>
                    </div>
                </div>
            </form>
        </section>

        <section class="visualization-space">
            <div class="metrics-grid">
                <div class="metric-card success">
                    <div class="metric-title">Portfolio Success Rate</div>
                    <div class="metric-value" id="valSuccessRate">--%</div>
                </div>
                <div class="metric-card info">
                    <div class="metric-title">Successful Runs</div>
                    <div class="metric-value" id="valSuccessfulRuns">--</div>
                </div>
                <div class="metric-card danger">
                    <div class="metric-title">Insolvency Events</div>
                    <div class="metric-value" id="valInsolventRuns">--</div>
                </div>
                <div class="metric-card warning">
                    <div class="metric-title">Avg Insolvency Timeline</div>
                    <div class="metric-value" id="valAvgInsolvencyYear">Year --</div>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
