<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Retirement Portfolio Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title-row">
                <div>
                    <h1>Retirement Portfolio Simulator</h1>
                </div>
                <button type="button" id="collapse-btn" class="collapse-btn">Collapse Inputs 🔼</button>
            </div>
        </header>

        <div class="main-layout">
            <section class="control-panel" id="control-panel">
                <form id="sim-form">
                    <div class="inputs-grid">
                        <div class="input-group">
                            <label>US Equities (%)</label>
                            <input type="number" id="us_alloc" value="60" step="1">
                        </div>
                        <div class="input-group">
                            <label>Intl Equities (%)</label>
                            <input type="number" id="intl_alloc" value="20" step="1">
                        </div>
                        <div class="input-group">
                            <label>Bonds (%)</label>
                            <input type="number" id="bond_alloc" value="20" step="1">
                        </div>
                        <div class="input-group">
                            <label>Simulations</label>
                            <input type="number" id="n_sims" value="1000" step="1">
                        </div>
                        <div class="input-group">
                            <label>Horizon (Years)</label>
                            <input type="number" id="n_years" value="65" step="1">
                        </div>
                        <div class="input-group">
                            <label>Drift (%)</label>
                            <input type="number" id="drift_pct" value="5" step="0.5">
                        </div>
                        <div class="input-group">
                            <label>Drawdown (%)</label>
                            <input type="number" id="drawdown_pct" value="20" step="1">
                        </div>
                        <div class="input-group">
                            <label>Init SWR (%)</label>
                            <input type="number" id="initial_swr" value="1" step="0.05">
                        </div>
                        <div class="input-group">
                            <label>Step SWR (%)</label>
                            <input type="number" id="step_swr" value="0.05" step="0.05">
                        </div>
                        <div class="input-group">
                            <label>Success (%)</label>
                            <input type="number" id="success_threshold" value="90" step="1">
                        </div>
                    </div>
                    <button type="submit" id="run-btn">Run Live Simulation</button>
                </form>
            </section>

            <main class="output-panel">
                <div id="status-text" class="placeholder-text">Configure parameters and click run.</div>
                <div class="chart-container">
                    <canvas id="simChart"></canvas>
                </div>
            </main>
        </div>
    </div>
    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
